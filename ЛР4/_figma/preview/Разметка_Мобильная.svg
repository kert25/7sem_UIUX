<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#FBF7F0"/><text x="100.0" y="49.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#bf6a4e" text-anchor="start"><tspan x="100.0" dy="0.0">ГРАФИЧЕСКАЯ РАЗМЕТКА · ПРАКТИЧЕСКАЯ РАБОТА № 4</tspan></text><text x="100.0" y="86.6" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#221f1a" text-anchor="start"><tspan x="100.0" dy="0.0">Адаптив: мобильная версия главной</tspan></text><rect x="100.0" y="108.0" width="1240.0" height="2.0" rx="0" fill="#221f1a" fill-opacity="1"/><text x="1340.0" y="53.8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#736c61" text-anchor="end"><tspan x="1340.0" dy="0.0">Экран 375 px · поля 18 px</tspan></text><text x="1340.0" y="73.8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#736c61" text-anchor="end"><tspan x="1340.0" dy="0.0">Брейкпоинты 1080 / 640 px</tspan></text><text x="100.0" y="132.3" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="100.0" dy="0.0">На мобильном сетка складывается в одну колонку, меню уходит в бургер, второстепенные блоки — в аккордеон.</tspan></text><rect x="90.0" y="150.0" width="395.0" height="720.0" rx="24" fill="#ffffff" fill-opacity="1" stroke="#221f1a" stroke-width="2"/><rect x="100.0" y="160.0" width="375.0" height="22.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="172.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">Доставка 2 ч</tspan></text><ellipse cx="103.0" cy="163.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="167.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">1</tspan></text><rect x="100.0" y="192.0" width="375.0" height="36.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="211.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">меню · Флёр · избранное · корзина</tspan></text><ellipse cx="103.0" cy="195.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="199.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">2</tspan></text><rect x="100.0" y="238.0" width="375.0" height="120.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="299.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">Слайдер 300 px</tspan></text><ellipse cx="103.0" cy="241.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="245.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">3</tspan></text><rect x="100.0" y="368.0" width="375.0" height="84.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="411.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">H1 34 px · CTA на всю ширину</tspan></text><ellipse cx="103.0" cy="371.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="375.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">4</tspan></text><rect x="100.0" y="462.0" width="176.0" height="44.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="188.0" y="485.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="188.0" dy="0.0">Категория</tspan></text><rect x="287.0" y="462.0" width="176.0" height="44.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="375.0" y="485.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="375.0" dy="0.0">Категория</tspan></text><ellipse cx="103.0" cy="465.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="469.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">5</tspan></text><rect x="100.0" y="516.0" width="375.0" height="96.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="565.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">Карточка букета — на всю ширину</tspan></text><ellipse cx="103.0" cy="519.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="523.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">6</tspan></text><rect x="100.0" y="622.0" width="375.0" height="40.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="643.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">Преимущества — списком</tspan></text><ellipse cx="103.0" cy="625.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="629.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">7</tspan></text><rect x="100.0" y="672.0" width="375.0" height="56.0" rx="6" fill="#ede4d5" fill-opacity="1" stroke="#c3b4a0" stroke-width="1" stroke-dasharray="6 4"/><text x="287.5" y="701.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7d7264" text-anchor="middle"><tspan x="287.5" dy="0.0">Футер — колонки в аккордеон</tspan></text><ellipse cx="103.0" cy="675.0" rx="11.0" ry="11.0" fill="#bf6a4e" fill-opacity="1"/><text x="101.0" y="679.0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="101.0" dy="0.0">8</tspan></text><text x="600.0" y="176.4" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Что меняется на мобильном</tspan></text><text x="600.0" y="210.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Хедер</tspan></text><text x="760.0" y="210.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="760.0" dy="0.0">Меню скрывается, остаётся бургер 44 × 44</tspan></text><rect x="600.0" y="234.0" width="736.0" height="1.0" rx="0" fill="#e7dfd1" fill-opacity="1"/><text x="600.0" y="256.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Герой</tspan></text><text x="760.0" y="256.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="760.0" dy="0.0">Две колонки → одна: текст, под ним слайдер</tspan></text><rect x="600.0" y="280.0" width="736.0" height="1.0" rx="0" fill="#e7dfd1" fill-opacity="1"/><text x="600.0" y="302.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Категории</tspan></text><text x="760.0" y="302.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="760.0" dy="0.0">4 → 2 × 2, иконка над подписью</tspan></text><rect x="600.0" y="326.0" width="736.0" height="1.0" rx="0" fill="#e7dfd1" fill-opacity="1"/><text x="600.0" y="348.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Каталог</tspan></text><text x="760.0" y="348.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="760.0" dy="0.0">Карточки 1 в ряд, фильтры — в шторке</tspan></text><rect x="600.0" y="372.0" width="736.0" height="1.0" rx="0" fill="#e7dfd1" fill-opacity="1"/><text x="600.0" y="394.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Конструктор</tspan></text><text x="760.0" y="394.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="760.0" dy="0.0">Превью и итог — под списком цветов</tspan></text><rect x="600.0" y="418.0" width="736.0" height="1.0" rx="0" fill="#e7dfd1" fill-opacity="1"/><text x="600.0" y="440.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Футер</tspan></text><text x="760.0" y="440.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="760.0" dy="0.0">Колонки → аккордеон, контакты сверху</tspan></text><rect x="600.0" y="464.0" width="736.0" height="1.0" rx="0" fill="#e7dfd1" fill-opacity="1"/><text x="600.0" y="516.4" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#221f1a" text-anchor="start"><tspan x="600.0" dy="0.0">Правила адаптива</tspan></text><ellipse cx="603.0" cy="545.0" rx="3.0" ry="3.0" fill="#bf6a4e" fill-opacity="1"/><text x="618.0" y="544.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="618.0" dy="0.0">Минимальная зона касания — 44 × 44 px.</tspan></text><ellipse cx="603.0" cy="577.0" rx="3.0" ry="3.0" fill="#bf6a4e" fill-opacity="1"/><text x="618.0" y="576.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="618.0" dy="0.0">Шрифт тела не меньше 16 px.</tspan></text><ellipse cx="603.0" cy="609.0" rx="3.0" ry="3.0" fill="#bf6a4e" fill-opacity="1"/><text x="618.0" y="608.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="618.0" dy="0.0">Горизонтальной прокрутки нет.</tspan></text><ellipse cx="603.0" cy="641.0" rx="3.0" ry="3.0" fill="#bf6a4e" fill-opacity="1"/><text x="618.0" y="640.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="618.0" dy="0.0">Пагинация заменяется кнопкой «Показать ещё».</tspan></text><ellipse cx="603.0" cy="673.0" rx="3.0" ry="3.0" fill="#bf6a4e" fill-opacity="1"/><text x="618.0" y="672.7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#736c61" text-anchor="start"><tspan x="618.0" dy="0.0">Порядок блоков не меняется — меняется раскладка.</tspan></text></svg>